services:
  - type: web
    name: instagram-receipt-bot
    runtime: docker
    plan: starter            # needed for the persistent disk below
    healthCheckPath: /
    disk:
      name: receipts
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_ID
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: ALLOWED_SENDER_IDS
        sync: false
      - key: HYP_API_KEY
        sync: false
      - key: HYP_DEVELOPER_EMAIL
        sync: false
