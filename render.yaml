services:
  - type: web
    name: receipt-bot
    runtime: docker
    # Free plan: receipts live in Hyp, so no persistent disk is needed.
    # The service sleeps after ~15 idle minutes; the first message after that takes ~30s.
    # Without Hyp (locally drawn receipts), switch to "starter" and add a disk mounted at /data.
    plan: free
    healthCheckPath: /
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: BUSINESS_ID
        sync: false
      - key: BUSINESS_PHONE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: HYP_API_KEY
        sync: false
      - key: HYP_DEVELOPER_EMAIL
        sync: false
