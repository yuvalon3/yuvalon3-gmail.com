name: Shabbat Guard APK

on:
  push:
    paths:
      - "shabbat-guard/**"
      - ".github/workflows/shabbat-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shabbat-guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ShabbatGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShabbatGuard-apk
          path: shabbat-guard/ShabbatGuard.apk

      - name: Publish as a GitHub release (easy download from the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shabbat-guard-v${{ github.run_number }}
          name: "שומר שבת v1.0.${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          files: shabbat-guard/ShabbatGuard.apk
          body: "הורידו את ShabbatGuard.apk לטלפון והתקינו. הוראות מלאות ב-shabbat-guard/README.md"
